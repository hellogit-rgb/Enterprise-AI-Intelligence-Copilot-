services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    command: npm run dev -- --host 0.0.0.0 --port 5173

  backend:
    build:
      context: ./backend
    ports:
      - '4000:4000'
    command: npm run dev

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    ports:
      - '8000:8000'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
